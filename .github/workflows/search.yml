name: Search and Commit

on:
  schedule:
    # 每10分钟运行一次（使用cron语法）
    - cron: '*/10 * * * *'
  # 允许手动触发
  workflow_dispatch:

# 确保同一时间只有一个运行实例，新的运行会取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C++ program
        run: g++ -O3 -march=native -fopenmp -flto -o search *.cpp

      - name: Run search and commit periodically
        run: |
          # 启动搜索程序（后台运行），输出日志到文件
          ./search > search.log 2>&1 &
          SEARCH_PID=$!

          # 定义提交函数：当文件有变化时提交并推送
          commit_if_changed() {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pps_infinite.txt search.log
            # 如果有任何更改（包括新文件或修改），则提交
            if ! git diff --quiet && ! git diff --staged --quiet; then
              git commit -m "Update results [skip ci]"
              git push
            fi
          }

          # 先提交一次现有文件（如从之前运行恢复）
          commit_if_changed

          # 每10分钟检查一次进程是否还在运行，并提交更改
          while kill -0 $SEARCH_PID 2>/dev/null; do
            sleep 600          # 600秒 = 10分钟
            commit_if_changed
          done

          # 进程结束后再提交一次（确保最终结果被保存）
          commit_if_changed

          # 输出完整日志以便查看（可选）
          cat search.log
        shell: bash